name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned versions
        run: sh scripts/load-versions.sh >>"$GITHUB_ENV"
      - name: Check go.mod matches versions.env
        run: |
          gomod="$(sed -n 's/^go //p' go.mod)"
          if [ "$gomod" != "$GO_VERSION" ]; then
            echo "::error::go.mod has go $gomod, versions.env has GO_VERSION=$GO_VERSION"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: shellcheck (POSIX sh)
        run: |
          files="$(ls scripts/*.sh qpkg/shared/*.sh qpkg/package_routines tests/service/*.sh tests/service/fakes/*)"
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck -s sh $files
      - name: Service script under BusyBox with QTS test doubles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          sh scripts/build-qnetspeed.sh amd64 out test
          sudo sh scripts/test-service.sh out/qnetspeed

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            qpkg_arch: x86_64
            elf_machine: X86-64
            runner: ubuntu-24.04
          - goarch: arm64
            qpkg_arch: arm_64
            elf_machine: AArch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned versions
        run: sh scripts/load-versions.sh >>"$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Version string
        run: |
          base="$(sed -n 's/^QPKG_VER="\(.*\)"$/\1/p' qpkg/qpkg.cfg)"
          case "$GITHUB_REF" in
            refs/tags/v*) ver="${GITHUB_REF#refs/tags/v}" ;;
            *) ver="$base-dev+$(git rev-parse --short HEAD)" ;;
          esac
          echo "QNETSPEED_VERSION=$ver" >>"$GITHUB_ENV"
      - name: Build qnetspeed
        run: sh scripts/build-qnetspeed.sh "${{ matrix.goarch }}" out "$QNETSPEED_VERSION"
      - name: Build librespeed-cli ${{ env.LIBRESPEED_CLI_VERSION }}
        run: sh scripts/build-librespeed-cli.sh "${{ matrix.goarch }}" out
      - name: Cache iperf3
        id: iperf3-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iperf3-cache
          key: iperf3-${{ env.IPERF3_VERSION }}-${{ matrix.goarch }}-${{ hashFiles('third_party/versions.env', 'scripts/build-iperf3.sh', 'scripts/iperf3-in-container.sh') }}
      - name: Build iperf3 ${{ env.IPERF3_VERSION }} (static, musl)
        if: steps.iperf3-cache.outputs.cache-hit != 'true'
        run: sh scripts/build-iperf3.sh iperf3-cache
      - name: Collect iperf3
        run: cp iperf3-cache/iperf3 out/iperf3
      - name: Verify static binaries
        run: sh scripts/verify-static.sh "${{ matrix.elf_machine }}" out/qnetspeed out/librespeed-cli out/iperf3
      - name: Run --version (native ${{ matrix.goarch }})
        run: |
          out/qnetspeed version
          out/librespeed-cli --version
          out/iperf3 --version
          ls -l out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.qpkg_arch }}
          path: out/
          if-no-files-found: error

  # Dwie paczki .qpkg przez QDK 2.5.0 (spec pkt 11.2), kontrola zawartości, SHA256SUMS
  # i próbna instalacja paczki x86_64 instalatorem QDK w symulowanym QTS.
  package:
    needs: [test, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned versions
        run: sh scripts/load-versions.sh >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - name: Install QDK 2.5.0
        run: |
          set -eu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/qdk_2.5.0_amd64.deb" "$QDK_DEB_URL"
          echo "$QDK_DEB_SHA256  $RUNNER_TEMP/qdk_2.5.0_amd64.deb" | sha256sum -c -
          sudo apt-get update -qq
          # apt-get, nie dpkg -i: bez zależności (rsync) qbuild tworzy pustą paczkę z kodem 0.
          sudo apt-get install -y -qq "$RUNNER_TEMP/qdk_2.5.0_amd64.deb" busybox-static
          command -v qbuild rsync
      - name: Build .qpkg (x86_64, arm_64)
        run: sudo sh scripts/package-qpkg.sh artifacts dist
      - name: Install, update and remove the x86_64 package (simulated QTS)
        run: sudo sh scripts/test-service.sh artifacts/bin-x86_64/qnetspeed dist/qnap-netspeed_*_x86_64.qpkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qnap-netspeed-qpkg
          path: dist/
          if-no-files-found: error
