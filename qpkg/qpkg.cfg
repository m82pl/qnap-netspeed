# qnap-netspeed: konfiguracja paczki dla QDK 2.5.0 qbuild (spec pkt 8.1).
# QPKG_VER jest źródłem wersji dla CI: binaria spoza tagu dostają "<QPKG_VER>-dev+<sha>".
QPKG_NAME="qnap-netspeed"
QPKG_DISPLAY_NAME="Net Speed"
# Maks. 10 znaków (CI odrzuca dłuższe); tag wydania vX.Y.Z musi być równy QPKG_VER.
QPKG_VER="0.2.1"
QPKG_AUTHOR="Marcin Tarapata"
QPKG_SUMMARY="WAN and LAN speed tests, link monitoring and history for QNAP NAS"
QPKG_LICENSE="MIT"

# Start po usługach sieciowych.
QPKG_RC_NUM="190"
QPKG_SERVICE_PROGRAM="qnetspeed.sh"

# GUI: tylko HTTP. QPKG_WEB_SSL_PORT celowo nieustawiony (W2).
QPKG_WEBUI="/"
QPKG_WEB_PORT="8888"

# Binaria statyczne. QuTS hero 6.x raportuje 5.2.10, więc też przejdzie.
QTS_MINI_VERSION="5.0.0"

# Limity czasu (s): start, stop.
QPKG_TIMEOUT="60,60"
